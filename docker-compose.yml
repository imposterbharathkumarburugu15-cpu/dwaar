version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pramana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pramana}
      POSTGRES_USER: ${POSTGRES_USER:-pramana_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pramana_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pramana_user -d pramana"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pramana-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: pramana-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PRAMANA_DATABASE_URL: postgresql+psycopg://pramana_user:pramana_secure_pass_2026@postgres:5432/pramana
      PRAMANA_REDIS_URL: redis://redis:6379/0
      PRAMANA_CELERY_BROKER_URL: redis://redis:6379/1
      PRAMANA_CELERY_RESULT_URL: redis://redis:6379/2
      PRAMANA_CELERY_EAGER: "false"
    volumes:
      - app_data:/var/lib/pramana/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker-documents:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: pramana-worker-documents
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PRAMANA_DATABASE_URL: postgresql+psycopg://pramana_user:pramana_secure_pass_2026@postgres:5432/pramana
      PRAMANA_REDIS_URL: redis://redis:6379/0
      PRAMANA_CELERY_BROKER_URL: redis://redis:6379/1
      PRAMANA_CELERY_RESULT_URL: redis://redis:6379/2
      PRAMANA_CELERY_EAGER: "false"
    volumes:
      - app_data:/var/lib/pramana/data
    command: ["celery", "-A", "backend.pramana.distributed.celery_app", "worker", "-Q", "document_processing", "-c", "4", "-l", "INFO"]

  worker-verification:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: pramana-worker-verification
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PRAMANA_DATABASE_URL: postgresql+psycopg://pramana_user:pramana_secure_pass_2026@postgres:5432/pramana
      PRAMANA_REDIS_URL: redis://redis:6379/0
      PRAMANA_CELERY_BROKER_URL: redis://redis:6379/1
      PRAMANA_CELERY_RESULT_URL: redis://redis:6379/2
      PRAMANA_CELERY_EAGER: "false"
    volumes:
      - app_data:/var/lib/pramana/data
    command: ["celery", "-A", "backend.pramana.distributed.celery_app", "worker", "-Q", "ai_verification,certificate_verification,risk_scoring", "-c", "2", "-l", "INFO"]

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: pramana-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "3000:80"

volumes:
  postgres_data:
  redis_data:
  app_data:
