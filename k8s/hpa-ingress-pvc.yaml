apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pramana-api-hpa
  namespace: pramana
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pramana-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pramana-worker-documents-hpa
  namespace: pramana
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pramana-worker-documents
  minReplicas: 2
  maxReplicas: 16
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 85
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pramana-ingress
  namespace: pramana
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "60m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
spec:
  tls:
    - hosts:
        - pramana.aicte-india.org
      secretName: pramana-tls-cert
  rules:
    - host: pramana.aicte-india.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pramana-api-service
                port:
                  number: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pramana-storage-pvc
  namespace: pramana
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Gi

